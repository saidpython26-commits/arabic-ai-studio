name: FreeGen AI Studio CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx
          if [ -f apps/api/requirements.txt ]; then pip install -r apps/api/requirements.txt; fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: |
          npm ci || npm install

      - name: Run Build & Typecheck
        run: |
          npm run build

      - name: Run Smoke Verification Test (10 Acceptance Criteria)
        env:
          OLLAMA_BASE_URL: http://localhost:11434
        run: |
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh
